<!DOCTYPE html>
<html>

<head>

<title>Mobile Chat App</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="/static/style.css">

</head>


<body>


<div class="app">


<!-- LOGIN SCREEN -->

<div id="auth">

    <div class="logo">
        📱
    </div>

    <h2>Mobile Chat</h2>

    <p>Create account or login</p>


    <input 
    id="username"
    placeholder="Username">


    <input 
    id="phone"
    placeholder="Phone Number">


    <input 
    id="password"
    type="password"
    placeholder="Password">


    <button onclick="register()">
        Create Account
    </button>


    <button onclick="login()">
        Login
    </button>


    <p id="authMessage"></p>

</div>





<!-- CHAT APPLICATION -->

<div id="chat" class="hidden">



<!-- TOP HEADER -->

<div class="header">


<div>

<h3>
💬 Mobile Chat
</h3>

<span id="status">
🔴 Offline
</span>

</div>


<div class="call-buttons">


<button onclick="startAudioCall()">
📞
</button>


<button onclick="startVideoCall()">
📹
</button>


<button onclick="startGroupCall()">
👥
</button>


</div>


</div>







<div class="main">



<!-- CONTACT LIST -->

<div class="contacts">


<h4>
Contacts
</h4>


<input
id="receiver"
placeholder="Search username">


<button onclick="loadMessages()">
Load Chat
</button>



<h4>
Calls
</h4>


<button onclick="endCall()">
End Call
</button>


</div>








<!-- CHAT WINDOW -->


<div class="chat-window">



<div class="chat-header">

Conversation

</div>





<ul id="messages">

</ul>




<div id="typing">

</div>








<!-- VIDEO AREA -->


<div class="video-container">


<video 
id="localVideo"
autoplay
muted>
</video>



<video 
id="remoteVideo"
autoplay>
</video>


</div>









<!-- MESSAGE BOX -->


<div class="message-box">


<input
id="message"
placeholder="Type message..."
onkeypress="enterSend(event)">


<button onclick="sendMessage()">
➤
</button>


</div>







<!-- FILES -->


<div class="file-area">


<input
type="file"
id="file">


<button onclick="uploadFile()">
📎
</button>


</div>



</div>


</div>







<!-- FEATURES -->

<div class="features">


<span>
✅ Messaging
</span>


<span>
✅ Files
</span>


<span>
✅ Audio Call
</span>


<span>
✅ Video Call
</span>


<span>
✅ Group Call
</span>


</div>




</div>


</div>



<script src="/static/app.js"></script>


</body>

</html>
