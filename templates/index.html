<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>chatMe</title>


    <!-- Main stylesheet -->
    <link rel="stylesheet" href="/static/style.css">


    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">


</head>


<body>


<div class="app-container">



<!-- ==============================
     AUTHENTICATION PAGE
================================ -->


<section id="auth-page" class="auth-container">


    <div class="auth-card">


        <div class="app-logo">

            💬

        </div>



        <h1>
            chatMe
        </h1>


        <p>
            Connect with friends instantly
        </p>




        <div class="input-group">


            <label>
                Username
            </label>


            <input
                id="username"
                type="text"
                placeholder="Enter username"
            >


        </div>





        <div class="input-group">


            <label>
                Phone Number
            </label>


            <input
                id="phone"
                type="text"
                placeholder="Enter phone number"
            >


        </div>





        <div class="input-group">


            <label>
                Password
            </label>


            <input
                id="password"
                type="password"
                placeholder="Enter password"
            >


        </div>





        <div class="auth-buttons">


            <button
                class="primary-btn"
                onclick="register()"
            >

                Create Account

            </button>




            <button
                class="secondary-btn"
                onclick="login()"
            >

                Login

            </button>



        </div>





        <div id="authMessage"
             class="auth-message">

        </div>



    </div>


</section>



<!-- ==============================
     CHAT APPLICATION
================================ -->


<section id="chat-page"
         class="chat-container hidden">



    <!-- TOP BAR -->


    <header class="top-bar">


        <div class="profile-area">


            <div class="avatar">

                👤

            </div>



            <div>


                <h2>
                    chatMe
                </h2>



                <span id="status">

                    Offline

                </span>



            </div>



        </div>


        <div class="top-actions">


            <button
                onclick="startAudioCall()"
                title="Audio Call"
            >

                📞

            </button>



            <button
                onclick="startVideoCall()"
                title="Video Call"
            >

                📹

            </button>



            <button
                onclick="createGroupCall()"
                title="Group Call"
            >

                👥

            </button>



            <button
                onclick="toggleTheme()"
                title="Theme"
            >

                🌙

            </button>


        </div>


    </header>


    <!-- MAIN CHAT AREA -->


    <div class="chat-layout">





        <!-- CONTACT SIDEBAR -->


        <aside class="sidebar">



            <div class="search-box">


                <input
                    id="receiver"
                    placeholder="Search username..."
                >



            </div>





            <button
                class="load-btn"
                onclick="loadMessages()"
            >

                Load Conversation

            </button>

            <div class="contact-title">

                Contacts

            </div>





            <div id="contacts">


                <div class="contact-item">

                    🟢 Online Users

                </div>


            </div>
          
        <!-- =========================
             CHAT WINDOW
        ========================== -->


        <main class="chat-window">



            <!-- CHAT HEADER -->


            <div class="conversation-header">


                <div>


                    <h3 id="chatUser">

                        Select User

                    </h3>


                    <span id="typing">

                    </span>


                </div>



                <div class="conversation-actions">


                    <button onclick="startAudioCall()">

                        📞

                    </button>



                    <button onclick="startVideoCall()">

                        📹

                    </button>


                </div>



            </div>

            <!-- MESSAGE DISPLAY -->


            <div class="message-area">


                <ul id="messages">


                </ul>


            </div>


            <!-- VIDEO CALL AREA -->


            <div id="call-area"
                 class="call-area hidden">



                <div class="video-box">


                    <video
                        id="localVideo"
                        autoplay
                        muted>
                    </video>



                    <span>
                        You
                    </span>


                </div>


                <div class="video-box">


                    <div id="remoteVideo">


                    </div>


                    <span>
                        Remote
                    </span>


                </div>



            </div>

            <!-- MESSAGE INPUT -->


            <div class="message-input-area">



                <button
                    class="emoji-btn"
                    onclick="toggleEmoji()"
                >

                    😊

                </button>





                <input

                    id="message"

                    type="text"

                    placeholder="Type a message..."

                    onkeypress="enterSend(event)"

                >

                <button

                    class="send-btn"

                    onclick="sendMessage()"

                >

                    ➤

                </button>



            </div>

            <!-- EMOJI PANEL -->


            <div id="emoji-panel"
                 class="emoji-panel hidden">


                <button onclick="addEmoji('😀')">
                    😀
                </button>


                <button onclick="addEmoji('😂')">
                    😂
                </button>


                <button onclick="addEmoji('❤️')">
                    ❤️
                </button>


                <button onclick="addEmoji('👍')">
                    👍
                </button>


                <button onclick="addEmoji('🔥')">
                    🔥
                </button>


                <button onclick="addEmoji('😍')">
                    😍
                </button>



            </div>

            <!-- FILE UPLOAD -->


            <div class="file-upload">


                <input
                    id="file"
                    type="file"
                >

                <button
                    onclick="uploadFile()"
                >

                    📎 Upload

                </button>



            </div>





        </main>


    </div>
    <!-- =========================
         GROUP CALL MODAL
    ========================== -->


    <div id="group-call-modal"
         class="modal hidden">



        <div class="modal-card">


            <h3>

                Group Call

            </h3>



            <input
                id="roomId"
                placeholder="Room ID"
            >

            <button
                onclick="joinGroupCall()"
            >

                Join Room

            </button>



            <button
                onclick="closeModal()"
            >

                Close

            </button>



        </div>


    </div>




</section>



<script src="/static/app.js"></script>


</body>


</html>



        </aside>
