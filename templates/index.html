<!DOCTYPE html>
<html>

<head>

<title>Mobile Chat App</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="/static/style.css">

</head>


<body>


<div class="app">


<!-- ==========================
LOGIN / REGISTER
========================== -->


<div id="auth">


<div class="logo">
📱
</div>


<h2>
Mobile Chat
</h2>


<p>
Create account or login
</p>



<input
id="username"
placeholder="Username">



<input
id="phone"
placeholder="Phone number">



<input
id="password"
type="password"
placeholder="Password">





<button onclick="register()">
Create Account
</button>



<button onclick="login()">
Login
</button>



<p id="authMessage"></p>


</div>






<!-- ==========================
CHAT APPLICATION
========================== -->


<div id="chat" class="hidden">





<!-- HEADER -->


<div class="header">


<div>

<h3>
💬 Mobile Chat
</h3>


<span id="status">
🔴 Offline
</span>


</div>



<div class="call-buttons">


<button onclick="startAudioCall()">
📞
</button>


<button onclick="startVideoCall()">
📹
</button>


</div>


</div>







<!-- MAIN -->


<div class="main">





<!-- CONTACTS -->


<div class="contacts">


<h4>
Contact
</h4>



<input
id="receiver"
placeholder="Username">



<button onclick="loadMessages()">
Load
</button>




<button onclick="endCall()">
End Call
</button>



</div>








<!-- CHAT AREA -->


<div class="chat-window">



<div class="chat-title">

Conversation

</div>





<ul id="messages">

</ul>




<div id="typing">

</div>







<!-- VIDEO -->


<div class="video-container">


<video
id="localVideo"
autoplay
muted>
</video>



<video
id="remoteVideo"
autoplay>
</video>


</div>







<!-- MESSAGE -->


<div class="message-box">


<input
id="message"
placeholder="Type message..."
onkeypress="if(event.key==='Enter')sendMessage()">



<button onclick="sendMessage()">
➤
</button>



</div>





<!-- FILE -->


<div class="file-area">


<input
type="file"
id="file">



<button onclick="uploadFile()">
📎
</button>


</div>




</div>


</div>








<div class="features">


<span>
✅ Chat
</span>


<span>
✅ Calls
</span>


<span>
✅ Video
</span>


<span>
✅ Files
</span>


</div>





</div>



<script src="/static/app.js"></script>


</body>

</html>
