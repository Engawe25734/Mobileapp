<!DOCTYPE html>
<html>

<head>

<title>Mobile Chat</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="/static/style.css">

</head>


<body>


<div class="app">



<!-- =====================
LOGIN
===================== -->

<div id="auth">


<div class="logo">
💬
</div>


<h2>
Mobile Chat
</h2>


<p>
Connect with friends
</p>



<input
id="username"
placeholder="Username"
>


<input
id="phone"
placeholder="Phone Number"
>


<input
id="password"
type="password"
placeholder="Password"
>



<button onclick="register()">
Create Account
</button>


<button onclick="login()">
Login
</button>



<p id="authMessage"></p>


</div>







<!-- =====================
CHAT APP
===================== -->


<div id="chat" class="hidden">






<!-- HEADER -->

<div class="header">


<div>

<h3>
💬 Mobile Chat
</h3>


<span id="status">
🔴 Offline
</span>


</div>





<div class="header-buttons">


<button onclick="startAudioCall()">
📞
</button>


<button onclick="startVideoCall()">
📹
</button>


<button onclick="startGroupCall()">
👥
</button>


</div>



</div>









<div class="content">





<!-- CONTACTS -->

<div class="contacts">


<h4>
Chats
</h4>



<input
id="receiver"
placeholder="Username"
>



<button onclick="loadMessages()">
Open Chat
</button>





<hr>



<h4>
Group Call
</h4>



<input
id="room"
placeholder="Room ID"
>



<button onclick="createGroupCall()">

Create Room

</button>



<button onclick="joinGroupCall()">

Join Room

</button>



<button onclick="leaveGroupCall()">

Leave Room

</button>





<hr>



<button onclick="endCall()">

End Call

</button>



</div>









<!-- CHAT WINDOW -->

<div class="chat-window">





<div class="chat-title">

Conversation

</div>






<ul id="messages">

</ul>






<div id="typing">

</div>







<!-- VIDEO -->

<div class="video-container">


<video

id="localVideo"

autoplay

muted>

</video>



<video

id="remoteVideo"

autoplay>

</video>



</div>







<!-- MESSAGE INPUT -->


<div class="message-box">


<input

id="message"

placeholder="Type message..."

onkeypress="enterSend(event)"

>


<button onclick="sendMessage()">

➤

</button>



</div>







<!-- FILE UPLOAD -->


<div class="file-box">


<input

type="file"

id="file"

>



<button onclick="uploadFile()">

📎

</button>



</div>






</div>



</div>










<!-- FEATURES -->


<div class="features">


<span>
✅ Chat
</span>


<span>
✅ Files
</span>


<span>
✅ Audio
</span>


<span>
✅ Video
</span>


<span>
✅ Group Call
</span>


</div>





</div>




<script src="/static/app.js"></script>


</body>


</html>
